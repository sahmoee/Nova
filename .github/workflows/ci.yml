name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-platforms:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate project registration and configuration
        run: |
          ./validate_nova_config.sh
          ./bundleid-guard.sh
          ./verify_registration.sh
          plutil -lint Nova.xcodeproj/project.pbxproj
      - name: Select an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build and test iOS
        run: >-
          xcodebuild
          -project Nova.xcodeproj
          -scheme Nova-iOS
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Build tvOS
        run: >-
          xcodebuild
          -project Nova.xcodeproj
          -scheme Nova-tvOS
          -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          build
