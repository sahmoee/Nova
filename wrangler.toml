name = "frametv-ai-worker"
main = "worker.js"
compatibility_date = "2025-01-01"

# Snapshot sharing (peer-to-peer restore codes) needs a KV namespace bound as
# SNAPSHOTS. Create it and paste the id below:
#
#   npx wrangler kv namespace create SNAPSHOTS
#
# then uncomment and fill in the id it prints:
#
# [[kv_namespaces]]
# binding = "SNAPSHOTS"
# id = "<your-kv-namespace-id>"
#
# The AI features (title/filter/troubleshoot) work without KV; only /share/* needs it.

# Environment variables that are NOT secret can go here. The model can be overridden:
[vars]
MODEL = "claude-sonnet-4-6"

# SECRETS are NOT stored in this file. Set them from the command line so they never
# end up in source control:
#
#   npx wrangler secret put ANTHROPIC_API_KEY
#   # (optional, to lock the Worker to your app:)
#   npx wrangler secret put FRAMETV_SHARED_TOKEN
#
# See README.md for the full setup walkthrough.
